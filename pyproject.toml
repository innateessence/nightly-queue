[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightly-queue-cli"
version = "0.1.0"
description = "Submit project-linked work to nightly-queue"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nq = "nq.cli:main"

[tool.setuptools.packages.find]
include = ["nq*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"hello/models.py" = ["F401"]
"hello/admin.py" = ["F401"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibearr-cli"
version = "0.1.0"
description = "Submit project-linked work to vibearr"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vibearr = "vibearr.cli:main"

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["vibearr"]

[tool.ruff]
line-length = 120

[tool.black]
target-version = ["py312"]

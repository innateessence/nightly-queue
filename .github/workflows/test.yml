name: Component prerequisite checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ github.event_name == 'pull_request' && 'Component with pinned prerequisites' || 'Application, runtime and recovery' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact candidate and complete prerequisite objects
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run full Docker checks with explicit source provenance
        env:
          VIBEARR_COMPONENT_OUTPUT: ${{ runner.temp }}/docker-checks
          VIBEARR_CHECK_OUTPUT: ${{ runner.temp }}/docker-checks
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            bash deploy/docker/component-ci.sh
          else
            bash deploy/docker/checks.sh full --candidate "$GITHUB_WORKSPACE" --commit "$CANDIDATE_SHA"
          fi
      - name: Upload composition provenance and full Docker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-test-evidence
          path: ${{ runner.temp }}/docker-checks
          if-no-files-found: error
          retention-days: 7

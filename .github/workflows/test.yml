name: Tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Run test.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: vibearr-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify standalone distribution artifacts
        run: |
          python3.12 -m venv "$RUNNER_TEMP/vibearr-distributions"
          "$RUNNER_TEMP/vibearr-distributions/bin/python" -m pip install setuptools==80.9.0 wheel==0.48.0
          "$RUNNER_TEMP/vibearr-distributions/bin/python" -m unittest vibearr.test_distributions

      - name: Run test suite
        run: bash test.sh

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Clean up services
        if: always()
        run: docker compose down --volumes --remove-orphans

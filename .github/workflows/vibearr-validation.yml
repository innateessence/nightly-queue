name: Vibearr validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      BOOTSTRAP_RECIPE_SHA: 6c74981e84311fdb5fe4172e43f5df990d33c817
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate
          persist-credentials: false
      - name: Check out the immutable base recipe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.TRUSTED_BASE_SHA }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false
      - name: Locate the immutable base recipe
        id: recipe
        run: |
          echo "VIBEARR_RECIPE=$GITHUB_WORKSPACE/trusted" >> "$GITHUB_ENV"
          if ! test -f trusted/vibearr_executor/validation_profile.py; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check out the reviewed introduction recipe
        if: steps.recipe.outputs.bootstrap == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ env.BOOTSTRAP_RECIPE_SHA }}
          path: bootstrap-recipe
          fetch-depth: 0
          persist-credentials: false
      - name: Verify that the real base predates the introduction
        if: steps.recipe.outputs.bootstrap == 'true'
        run: |
          git -C bootstrap-recipe merge-base --is-ancestor "$TRUSTED_BASE_SHA" "$BOOTSTRAP_RECIPE_SHA"
          test -f bootstrap-recipe/vibearr_executor/validation_profile.py
          echo "VIBEARR_RECIPE=$GITHUB_WORKSPACE/bootstrap-recipe" >> "$GITHUB_ENV"
      - name: Install the trusted executor and runner outside both checkouts
        run: |
          cd "$VIBEARR_RECIPE"
          python3.12 -m venv "$RUNNER_TEMP/validation-build"
          "$RUNNER_TEMP/validation-build/bin/python" -m pip install setuptools==80.9.0 wheel==0.48.0
          "$RUNNER_TEMP/validation-build/bin/python" -m pip wheel --no-build-isolation --no-deps ./vibearr_executor ./vibearr_runner --wheel-dir "$RUNNER_TEMP/validation-wheels"
          python3.12 -m venv "$RUNNER_TEMP/installed-validation"
          "$RUNNER_TEMP/installed-validation/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/validation-wheels/*.whl
      - name: Build the trusted validation image and install the pinned database
        run: |
          docker build -f "$VIBEARR_RECIPE/vibearr_executor/validation.Dockerfile" -t vibearr-ci-validation "$VIBEARR_RECIPE"
          docker pull postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f
          image=$(docker image inspect vibearr-ci-validation --format '{{.Id}}')
          database=$(docker image inspect postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f --format '{{.Id}}')
          "$RUNNER_TEMP/installed-validation/bin/python" -I -m vibearr_executor.validation_profile --image "$image" --database-image "$database" --requirements "$VIBEARR_RECIPE/requirements.txt" --output "$RUNNER_TEMP/validation-profile.json"
      - name: Qualify the host and validate the exact candidate tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/installed-validation/bin/python" -I -m vibearr_runner.validation_cli \
            --checkout "$GITHUB_WORKSPACE/candidate" --commit "$CANDIDATE_SHA" \
            --profile "$RUNNER_TEMP/validation-profile.json" --state "$RUNNER_TEMP/validation-state" \
            --evidence "$RUNNER_TEMP/validation-evidence.json"
      - name: Upload validation and host qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibearr-validation-evidence
          path: |
            ${{ runner.temp }}/validation-evidence.json
            ${{ runner.temp }}/validation-state/qualification.json
            ${{ runner.temp }}/validation-state/candidate/*.log
            ${{ runner.temp }}/validation-state/candidate/session.json
            ${{ runner.temp }}/validation-state/operations/*/logs.bin
            ${{ runner.temp }}/validation-state/dependency-builds/*/record.json
            ${{ runner.temp }}/validation-state/dependency-builds/*/qualification.log
            ${{ runner.temp }}/validation-state/dependency-builds/*/qualification-exit.json
          if-no-files-found: warn
          retention-days: 7

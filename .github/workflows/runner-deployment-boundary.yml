name: Runner deployment boundary qualification

on:
  workflow_dispatch:
    inputs:
      executor_image:
        description: 'Installed immutable task image ID (sha256:...) on the executor host'
        required: true
      database_image:
        description: 'Installed immutable PostgreSQL 17 image ID (sha256:...)'
        required: true

permissions:
  contents: read

jobs:
  boundary:
    runs-on: [self-hosted, runner-deployment-qualification]
    timeout-minutes: 20
    steps:
      - name: Check out trusted executor source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Qualify actual installed OCI runtime on its host
        env:
          EXECUTOR_IMAGE: ${{ inputs.executor_image }}
          DATABASE_IMAGE: ${{ inputs.database_image }}
        run: |
          python3.12 -m vibearr_runner.verify --boundary \
            --executor-image "$EXECUTOR_IMAGE" --database-image "$DATABASE_IMAGE" \
            --executor-state "$RUNNER_TEMP/vibearr-oci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --evidence "$RUNNER_TEMP/runner-boundary.json"
      - name: Upload actual deployment boundary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-deployment-boundary
          path: ${{ runner.temp }}/runner-boundary.json
          if-no-files-found: error
          retention-days: 7

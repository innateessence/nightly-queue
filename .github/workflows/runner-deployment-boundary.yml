name: Runner deployment boundary qualification

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Approved runner image at an immutable sha256 digest'
        required: true
      policy_artifact:
        description: 'Absolute path of the reviewed Compose deployment overlay on this runner'
        required: true

permissions:
  contents: read

jobs:
  boundary:
    runs-on: [self-hosted, runner-deployment-qualification]
    timeout-minutes: 20
    steps:
      - name: Verify the exact reviewed deployment
        env:
          RUNNER_IMAGE: ${{ inputs.image }}
          RUNNER_POLICY: ${{ inputs.policy_artifact }}
        run: |
          case "$RUNNER_IMAGE" in *@sha256:*) ;; *) echo 'Immutable image digest required'; exit 1;; esac
          test -f "$RUNNER_POLICY"
          deployment_config=$(mktemp)
          docker compose -f "$RUNNER_POLICY" config --format json > "$deployment_config"
          python3 -c 'import json,os,sys; config=json.load(open(sys.argv[1])); assert config["services"]["coding-runner"]["image"] == os.environ["RUNNER_IMAGE"]' "$deployment_config"
          rm "$deployment_config"
          mkdir -p "$RUNNER_TEMP/runner-boundary"
          chmod 0777 "$RUNNER_TEMP/runner-boundary"
          policy_digest=$(sha256sum "$RUNNER_POLICY" | cut -d ' ' -f 1)
          docker compose -f "$RUNNER_POLICY" run --rm --no-deps --entrypoint python \
            --volume "$RUNNER_TEMP/runner-boundary:/qualification-output" \
            -e NQ_RUNNER_IMAGE_DIGEST="${RUNNER_IMAGE##*@}" \
            -e NQ_RUNNER_SANDBOX_POLICY_DIGEST="$policy_digest" \
            -e NQ_RUNNER_SOURCE_REVISION="$GITHUB_SHA" \
            coding-runner -m coding_runner.verify --boundary --evidence /qualification-output/runner-boundary.json
      - name: Upload actual deployment boundary evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-deployment-boundary
          path: ${{ runner.temp }}/runner-boundary/runner-boundary.json
          if-no-files-found: error
          retention-days: 7
      - name: Record qualification scope
        env:
          RUNNER_IMAGE: ${{ inputs.image }}
          RUNNER_POLICY: ${{ inputs.policy_artifact }}
        run: |
          printf '%s\n' "$RUNNER_IMAGE"
          sha256sum "$RUNNER_POLICY"
          uname -r

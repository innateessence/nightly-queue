name: Runner deployment boundary qualification

on:
  workflow_dispatch:
    inputs:
      project:
        description: Existing three-container Compose project to inspect without enabling processing
        required: true

permissions:
  contents: read

jobs:
  boundary:
    runs-on: [self-hosted, runner-deployment-qualification]
    timeout-minutes: 10
    steps:
      - name: Inspect the current integrated runner boot
        shell: bash
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          [[ "$PROJECT" =~ ^[a-z0-9][a-z0-9_-]{0,62}$ ]]
          mapfile -t ids < <(docker ps -q --filter "label=com.docker.compose.project=$PROJECT")
          ((${#ids[@]} == 3))
          mapfile -t runner < <(docker ps -q --filter "label=com.docker.compose.project=$PROJECT" --filter label=com.docker.compose.service=runner)
          ((${#runner[@]} == 1))
          docker exec "${runner[0]}" python -I -c 'import json; from pathlib import Path; from vibearr_executor.client import Client; c=Client("http://127.0.0.1:8791",Path("/run/vibearr/runner/control-token").read_text().strip()); r=c.capabilities(); assert r["runtime"] == "integrated-runner-v1" and r["qualified"] is True; print(json.dumps(r))' > "$RUNNER_TEMP/runner-boundary.json"
          docker inspect "${ids[@]}" --format '{{.Name}} {{.Image}} {{.HostConfig.ReadonlyRootfs}}' > "$RUNNER_TEMP/runtime-images.txt"
      - name: Upload actual deployment observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-deployment-boundary
          path: |
            ${{ runner.temp }}/runner-boundary.json
            ${{ runner.temp }}/runtime-images.txt
          if-no-files-found: error
          retention-days: 7

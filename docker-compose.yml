x-database-environment: &database-environment
  POSTGRES_DB: "${POSTGRES_DB:-nightly_queue}"
  POSTGRES_USER: "${POSTGRES_USER:-nightly_queue}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nightly_queue}"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:

  coding-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: coding_runner/Dockerfile
    image: nightly-queue-coding-runner
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
      # Codex's bubblewrap sandbox requires unprivileged user namespaces.
      - seccomp:unconfined
    stop_grace_period: 15s
    environment:
      NQ_URL: http://nightly-queue:8000
      NQ_API_TOKEN: "${NQ_API_TOKEN:-}"
      GH_TOKEN: "${NQ_RUNNER_GITHUB_TOKEN:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      NQ_RUNNER_PROJECTS: /etc/coding-runner/projects.json
      NQ_RUNNER_MODEL: "${NQ_RUNNER_MODEL:-}"
      NQ_RUNNER_TIMEOUT_SECONDS: "${NQ_RUNNER_TIMEOUT_SECONDS:-3600}"
      NQ_RUNNER_POLL_SECONDS: "${NQ_RUNNER_POLL_SECONDS:-60}"
      NQ_RUNNER_TIMEZONE: "${NQ_RUNNER_TIMEZONE:-UTC}"
      NQ_RUNNER_WINDOW_START: "${NQ_RUNNER_WINDOW_START:-}"
      NQ_RUNNER_WINDOW_END: "${NQ_RUNNER_WINDOW_END:-}"
    depends_on:
      - nightly-queue
    volumes:
      - runner-data:/data
      - type: bind
        source: ${NQ_RUNNER_PROJECTS_FILE:-./.cache/runner-projects.json}
        target: /etc/coding-runner/projects.json
        read_only: true
        bind:
          create_host_path: false

  nightly-queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightly-queue-django
    container_name: nightly-queue-django
    ports:
      - "${PORT:-7777}:8000"
    environment:
      <<: *database-environment
      DJANGO_ALLOWED_HOSTS: "*"
      NQ_API_TOKEN: "${NQ_API_TOKEN:-}"
      NQ_CREDENTIAL_KEY: "${NQ_CREDENTIAL_KEY:-}"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

  postgres:
    image: postgres:17
    container_name: nightly-queue-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nightly_queue}"
      POSTGRES_USER: "${POSTGRES_USER:-nightly_queue}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nightly_queue}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: nightly-queue-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightly-queue-django
    container_name: nightly-queue-celery
    command: ["celery", "-A", "nightly_queue", "worker", "--loglevel=INFO", "-n", "worker@%h"]
    environment:
      <<: *database-environment
      DJANGO_SETTINGS_MODULE: "nightly_queue.settings"
      NQ_CREDENTIAL_KEY: "${NQ_CREDENTIAL_KEY:-}"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightly-queue-django
    container_name: nightly-queue-beat
    command: ["celery", "-A", "nightly_queue", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *database-environment
      DJANGO_SETTINGS_MODULE: "nightly_queue.settings"
      DJANGO_DEBUG: "False"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

volumes:
  runner-data:
  postgres-data:
  valkey-data:

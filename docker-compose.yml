x-database-environment: &database-environment
  POSTGRES_DB: "${POSTGRES_DB:-nightly_queue}"
  POSTGRES_USER: "${POSTGRES_USER:-nightly_queue}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nightly_queue}"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:

  nightly-queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightly-queue-django
    container_name: nightly-queue-django
    ports:
      - "${PORT:-7777}:8000"
    environment:
      <<: *database-environment
      DJANGO_ALLOWED_HOSTS: "*"
      NQ_API_TOKEN: "${NQ_API_TOKEN:-}"
      NQ_CREDENTIAL_KEY: "${NQ_CREDENTIAL_KEY:-}"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      - default
      - runner-api

  postgres:
    image: postgres:17
    container_name: nightly-queue-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-nightly_queue}"
      POSTGRES_USER: "${POSTGRES_USER:-nightly_queue}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nightly_queue}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: nightly-queue-valkey
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightly-queue-django
    container_name: nightly-queue-celery
    command: ["celery", "-A", "nightly_queue", "worker", "--loglevel=INFO", "-n", "worker@%h"]
    environment:
      <<: *database-environment
      DJANGO_SETTINGS_MODULE: "nightly_queue.settings"
      NQ_CREDENTIAL_KEY: "${NQ_CREDENTIAL_KEY:-}"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: nightly-queue-django
    container_name: nightly-queue-beat
    command: ["celery", "-A", "nightly_queue", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *database-environment
      DJANGO_SETTINGS_MODULE: "nightly_queue.settings"
      DJANGO_DEBUG: "False"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

  coding-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: coding_runner/Dockerfile
    image: nightly-queue-coding-runner
    environment:
      NQ_URL: "http://nightly-queue:8000"
      NQ_RUNNER_API_TOKEN: "${NQ_RUNNER_API_TOKEN:-}"
    volumes:
      - runner-data:/var/lib/coding-runner
    networks:
      - runner-api
      - runner-egress
      - runner-inference
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped

  runner-ollama:
    profiles: ["ollama"]
    build:
      context: .
      dockerfile: coding_runner/Dockerfile.ollama
    image: nightly-queue-runner-ollama:0.40.16
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: "/models"
      OLLAMA_NO_CLOUD: "1"
      HOME: "/tmp"
    volumes:
      - runner-ollama-models:/models
    networks:
      - runner-inference
      - runner-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  runner-api:
    internal: true
  runner-inference:
    internal: true
  runner-egress:

volumes:
  postgres-data:
  valkey-data:
  runner-data:
  runner-ollama-models:

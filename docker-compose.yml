name: "${COMPOSE_PROJECT_NAME:-nightly-queue}"

x-database-environment: &database-environment
  VIBEARR_POSTGRES_DB: "${VIBEARR_POSTGRES_DB-${POSTGRES_DB-nightly_queue}}"
  POSTGRES_DB: "${POSTGRES_DB-${VIBEARR_POSTGRES_DB-nightly_queue}}"
  VIBEARR_POSTGRES_USER: "${VIBEARR_POSTGRES_USER-${POSTGRES_USER-nightly_queue}}"
  POSTGRES_USER: "${POSTGRES_USER-${VIBEARR_POSTGRES_USER-nightly_queue}}"
  VIBEARR_POSTGRES_PASSWORD: "${VIBEARR_POSTGRES_PASSWORD-${POSTGRES_PASSWORD-nightly_queue}}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD-${VIBEARR_POSTGRES_PASSWORD-nightly_queue}}"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"

services:

  vibearr:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibearr-app
    ports:
      - "${PORT:-7777}:8000"
    environment:
      <<: *database-environment
      DJANGO_ALLOWED_HOSTS: "*"
      VIBEARR_API_TOKEN: "${VIBEARR_API_TOKEN-${NQ_API_TOKEN-}}"
      NQ_API_TOKEN: "${NQ_API_TOKEN-${VIBEARR_API_TOKEN-}}"
      VIBEARR_CREDENTIAL_KEY: "${VIBEARR_CREDENTIAL_KEY-${NQ_CREDENTIAL_KEY-}}"
      NQ_CREDENTIAL_KEY: "${NQ_CREDENTIAL_KEY-${VIBEARR_CREDENTIAL_KEY-}}"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app
    networks:
      default:
      runner-api:
        aliases: [nightly-queue]

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${VIBEARR_POSTGRES_DB-${POSTGRES_DB-nightly_queue}}"
      POSTGRES_USER: "${VIBEARR_POSTGRES_USER-${POSTGRES_USER-nightly_queue}}"
      POSTGRES_PASSWORD: "${VIBEARR_POSTGRES_PASSWORD-${POSTGRES_PASSWORD-nightly_queue}}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibearr-app
    command: ["celery", "-A", "vibearr_app", "worker", "--loglevel=INFO", "-n", "worker@%h"]
    environment:
      <<: *database-environment
      DJANGO_SETTINGS_MODULE: "vibearr_app.settings"
      VIBEARR_CREDENTIAL_KEY: "${VIBEARR_CREDENTIAL_KEY-${NQ_CREDENTIAL_KEY-}}"
      NQ_CREDENTIAL_KEY: "${NQ_CREDENTIAL_KEY-${VIBEARR_CREDENTIAL_KEY-}}"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: vibearr-app
    command: ["celery", "-A", "vibearr_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      <<: *database-environment
      DJANGO_SETTINGS_MODULE: "vibearr_app.settings"
      DJANGO_DEBUG: "False"
      CELERY_BROKER_URL: "redis://valkey:6379/0"
      CELERY_RESULT_BACKEND: "redis://valkey:6379/1"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    volumes:
      - ./:/app

  vibearr-runner:
    profiles: ["runner"]
    build:
      context: .
      dockerfile: vibearr_runner/Dockerfile
    image: vibearr-runner
    environment:
      VIBEARR_URL: "${VIBEARR_URL-${NQ_URL-http://vibearr:8000}}"
      VIBEARR_RUNNER_STATE_DIR: "${VIBEARR_RUNNER_STATE_DIR-${NQ_RUNNER_STATE_DIR-/var/lib/coding-runner}}"
      VIBEARR_RUNNER_API_TOKEN: "${VIBEARR_RUNNER_API_TOKEN-${NQ_RUNNER_API_TOKEN-}}"
      NQ_RUNNER_API_TOKEN: "${NQ_RUNNER_API_TOKEN-${VIBEARR_RUNNER_API_TOKEN-}}"
    volumes:
      - runner-data:${VIBEARR_RUNNER_STATE_DIR-${NQ_RUNNER_STATE_DIR-/var/lib/coding-runner}}
    networks:
      - runner-api
      - runner-egress
      - runner-inference
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped

  runner-ollama:
    profiles: ["ollama"]
    build:
      context: .
      dockerfile: vibearr_runner/Dockerfile.ollama
    image: vibearr-ollama:0.40.16
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODELS: "/models"
      OLLAMA_NO_CLOUD: "1"
      HOME: "/tmp"
    volumes:
      - runner-ollama-models:/models
    networks:
      - runner-inference
      - runner-egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    stop_grace_period: 30s
    restart: unless-stopped

networks:
  runner-api:
    internal: true
  runner-inference:
    internal: true
  runner-egress:

volumes:
  postgres-data:
    name: "${VIBEARR_DATA_PROJECT:-${COMPOSE_PROJECT_NAME:-nightly-queue}}_postgres-data"
  valkey-data:
    name: "${VIBEARR_DATA_PROJECT:-${COMPOSE_PROJECT_NAME:-nightly-queue}}_valkey-data"
  runner-data:
    name: "${VIBEARR_DATA_PROJECT:-${COMPOSE_PROJECT_NAME:-nightly-queue}}_runner-data"
  runner-ollama-models:
    name: "${VIBEARR_DATA_PROJECT:-${COMPOSE_PROJECT_NAME:-nightly-queue}}_runner-ollama-models"

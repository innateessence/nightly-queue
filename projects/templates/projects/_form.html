{% csrf_token %}
{% if form.errors %}
  <div class="form-errors" role="alert">
    <p>Please check your project details.</p>
    {{ form.non_field_errors }}
  </div>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="required">*</span>{% else %} <span class="optional">optional</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="field-hint" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
  </div>
{% endfor %}
<button class="button-primary" type="submit">{{ submit_label }}</button>

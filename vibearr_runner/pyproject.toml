[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vibearr-runner"
version = "0.1.0"
description = "Standalone vibearr supervisor"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
native-runtime = ["vibearr-executor==0.1.0"]

[project.scripts]
vibearr-runner = "vibearr_runner.__main__:main"
coding-runner = "vibearr_runner.__main__:main"

[tool.setuptools]
packages = ["vibearr_runner", "coding_runner"]
package-dir = {vibearr_runner = ".", coding_runner = "../coding_runner"}
